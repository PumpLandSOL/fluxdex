<div class="c" id="s5"><div><svg viewBox="0 0 40 40" style="width:150px"><defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#00f0ff"/><stop offset=".55" stop-color="#7b5cff"/><stop offset="1" stop-color="#ff3df5"/></linearGradient></defs><path id="wv" d="M6 27c5-16 10-16 13 0s9 15 15-2" stroke="url(#lg)" stroke-width="5" fill="none" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/></svg>

<script>
const $=(i)=>document.getElementById(i),cl=(x)=>Math.max(0,Math.min(1,x)),e=(x)=>1-Math.pow(1-cl(x),3),win=(t,a,b,f=.25)=>cl((t-a)/f)*cl((b-t)/f);
const cv=$('fld'),x=cv.getContext('2d');let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;const P=[];for(let i=0;i<260;i++)P.push([r()*1280,r()*720,r()]);const C=['0,240,255','123,92,255','255,61,245'];

const W=['ADL.','SOCIALIZED LOSSES.','BANK RUNS.'];const MK=[['BTC','50x'],['ETH','50x'],['SOL','50x'],['HYPE','25x'],['ZEC','20x'],['NEAR','20x'],['JUP','20x'],['PUMP','15x']];

window.__seek=(t)=>{

  $('s3').style.opacity=win(t,4.8,7);$('s3').firstElementChild.style.transform=`scale(${.9+.1*e((t-4.8)/.8)})`;
  $('s4').style.opacity=win(t,7,10.2);MK.forEach((m,i)=>{const p=e((t-7.3-i*.12)/.4);$('k'+i).style.opacity=p;$('k'+i).style.transform=`translateY(${(1-p)*40}px)`;});

};window.__seek(0);
